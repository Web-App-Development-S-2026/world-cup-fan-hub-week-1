<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${pageTitle}">About Page</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
            body {

                background-color: #f4f6f9;

            }

            .navbar {

                background-color: #0F2B1D;

            }

            .navbar-brand {

                font-weight: bold;

                color: #FFD700 !important;

            }

            .about-card{
                transition: transform 0.2s;

                border-radius: 12px;

                overflow: hidden;

                box-shadow: 0 4px 6px rgba(0,0,0,0.1);

                background: #fff;

                margin: 20px;
                padding: 30px;

            }
            .about-card:hover {

                transform: translateY(-5px);

                box-shadow: 0 8px 15px rgba(0,0,0,0.15);

            }

        </style>
    </head>

    <body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">
                ⚽ World Cup Fan & Event Hub
            </a>
            <a href="/" class="btn btn-success mt-3">Homepage</a>
        </div>
    </nav>

    <div class="container">
        <div class="about-card">

            <h1>About The World Cup 2026...</h1>

            <p>
                This world cup is held by three countries for the first time.
                The whole north america is going crazy over this worldwide event
                and 48 countries are trying to getting into the zone.
            </p>

            <p>
                
            </p>


        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
