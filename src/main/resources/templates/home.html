<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">World Cup Hub - Static Preview</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        body {

            background-color: #f4f6f9;

        }

        .navbar-brand {

            font-weight: bold;

            color: #FFD700 !important;

        }

        .navbar {

            background-color: #0F2B1D;

        }

        .team-card {

            transition: transform 0.2s;

            border-radius: 12px;

            overflow: hidden;

            box-shadow: 0 4px 6px rgba(0,0,0,0.1);

            background: #fff;

            margin-bottom: 20px;

        }

        .team-card:hover {

            transform: translateY(-5px);

            box-shadow: 0 8px 15px rgba(0,0,0,0.15);

        }

        .flag-img {

            height: 160px;

            object-fit: cover;

            border-bottom: 2px solid #eee;

        }
    </style>
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">

            ⚽ World Cup Fan & Event Hub
        </a>
    </div>
</nav>

<div class="container">
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h1 class="display-5 fw-bold text-dark">Participating Teams</h1>
            <p class="lead text-muted">Explore the top contenders competing in the tournament.</p>
        </div>
        <div class="col-auto text-end">
            <span class="badge bg-success fs-6"  th:text=" 'Total Team:' + ${#lists.size(teams)}">Total Teams: 6 Static</span>
        </div>
    </div>

                    <p class="card-text mb-2 text-muted" th:text="'Confederation : ' + ${team.confederation}" >Confederation: CONMEBOL</p>
                    <div class="mt-3">
                        <span class="badge rounded-pill px-3 py-2 bg-warning text-dark"  th:text="'Fifa Rank : ' + ${team.rank}" >FIFA Rank: 1</span>
                    </div>
                </div>
                <div class="card-footer bg-white border-top-0 pb-3 text-center">
                    <a href="#" class="btn btn-outline-success w-100">View Details</a>
                </div>
            </div>
